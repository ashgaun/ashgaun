name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ashgaun
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3B82F6&color_dots=#0D1117,#1E3A8A,#1E40AF,#2563EB,#3B82F6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
