name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ashgaun
          outputs: |
            dist/github-snake-dark.svg?color_snake=#93C5FD&color_dots=#1B2432,#2C5CB8,#4C8DF6,#7DB3FF,#B6D5FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
